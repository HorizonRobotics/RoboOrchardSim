scene:
  type: room_table
  num_envs: 1
  env_spacing: 2.5
  physics_fps: 600
  render_fps: 30
  step_fps: 30

embodiment:
  type: panda_droid
  initial_pos: [0.0, 0.0, 0.0]
  init_joint_noise_std: 0.05

# You can also use franka_panda embodiment for place_a2b task.
# embodiment:
#   type: franka_panda
#   initial_pos: [0.0, 0.0, 0.0]
#   init_joint_noise_std: 0.05

instruction:
  template: place_a2b_default
  template_mode: variants  # valid values: fixed | variants
  actor_description_mode: raw  # valid values: raw | seen | unseen

task:
  params:
    pose_reset:
      mode: random_non_overlap
      min_separation: 0.03
      pose_range:
        x: [0.25, 0.6]
        y: [-0.45, 0.45]
        z: [0.0, 0.0]
        roll: [0.0, 0.0]
        pitch: [0.0, 0.0]
        yaw: [-3.141592653589793, 3.141592653589793]
    light_reset:
      enabled: false
      preset: default_distant_light
    texture_reset:
      enabled: false
      preset: default_table_texture

# Template consumed by AssetResolver. Entries with an `anchor` key are
# distractors (role name is free); all others are targets and must
# match PlaceA2BTaskAssets fields.
#
# Default asset splits for data synthesis.
# For evaluation, configure `splits` and `split_type` in
# examples/manipulation-app/configs/eval_example.yaml.
# with unseen_instance
asset_configs:

  pick:
    filter:
      tags: [has_interactive_poses]        # AND-match; requires URDF <tags>
      # super_category: fruits          # ware / tableware / ornaments / ...
      # category: peach                 # mug / bowl / toothbrush / ...
      # color: white
      # shape: cylinder
      # material: ceramic
      # size_bucket: medium         # small / medium / large
    prim_name: pick_object          # runtime scene/prim name
    split: seen                   # seen / unseen_category / unseen_instance

  place:
    filter:
      tags: [is_container]
    prim_name: place_object
    split: seen

  distractors_pick:
    anchor: pick
    differ: [category]
    filter:
      tags: [has_interactive_poses]
    min_count: 6
    max_count: 6
    prim_name_prefix: dpick

  distractors_place:
    anchor: place
    differ: [category]
    split: seen
    filter:
      tags: [is_container]
    min_count: 1
    max_count: 1
    prim_name_prefix: dplace
