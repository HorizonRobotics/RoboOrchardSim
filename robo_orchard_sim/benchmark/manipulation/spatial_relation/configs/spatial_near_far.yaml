scene:
  type: room_table
  num_envs: 1
  env_spacing: 2.5
  physics_fps: 600
  render_fps: 30
  step_fps: 30

embodiment:
  type: panda_droid
  initial_pos: [0.0, 0.0, 0.0]
  init_joint_noise_std: 0.05

instruction:
  template: spatial_pick_default
  template_mode: fixed
  actor_description_mode: raw

# Every candidate is the same asset on purpose: the task asks which
# object the instruction means, so telling them apart has to come from
# how far each one sits from the reference and nothing else. `same_as`
# shares one draw across the slots, which is otherwise impossible --
# slots are de-duplicated so that scenes come out varied.
#
# Sharing a draw rather than naming a uuid keeps the split in force, so
# an evaluation can still be pointed at unseen assets.
#
# Keys double as scene names -- `prim_name` is filled in from them, so
# the names here, the placements below and the runtime logs all agree.
asset_configs:
  ref:
    filter: {tags: [is_graspable]}
    split: seen
  pick_near:
    filter: {tags: [is_graspable]}
    split: seen
  pick_far:
    same_as: pick_near
  clutter_0:
    same_as: pick_near
  clutter_1:
    same_as: pick_near

task:
  params:
    pose_reset:
      # Candidates are placed around wherever the reference landed, not
      # at absolute coordinates: distance is the whole point here, and
      # sampling both ends independently would let the reference's own
      # jitter close the gap between near and far.
      anchor_range: {x: [0.48, 0.62], y: [-0.08, 0.08]}
      workspace:    {x: [0.25, 0.80], y: [-0.40, 0.40]}

      # A distance word leaves its direction free, so which way the
      # target lies is redrawn every episode. Pinning it would let the
      # direction identify the target and the distance go unread --
      # the reverse of four_way.yaml, where direction is the point.
      axis_jitter: 40
      min_separation: 0.03
      relation_margin: 0.05

      # Radius is the only thing that carries meaning. `relation` marks
      # an object as something an instruction may ask for; the ones
      # without it are clutter, and their radii sit between near and far
      # so that neither word could honestly describe them.
      candidates:
        pick_near: {relation: near, radius: [0.1, 0.15]}
        pick_far:  {relation: far,  radius: [0.30, 0.38]}
        clutter_0: {radius: [0.20, 0.25]}
        clutter_1: {radius: [0.20, 0.25]}

    light_reset:
      enabled: false
      preset: default_distant_light
    texture_reset:
      enabled: false
      preset: default_table_texture
