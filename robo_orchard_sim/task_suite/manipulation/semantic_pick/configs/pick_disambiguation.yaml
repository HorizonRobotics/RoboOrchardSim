scene:
  type: plane_table
  num_envs: 1
  env_spacing: 2.5
  physics_fps: 600
  render_fps: 30
  step_fps: 30

embodiment:
  type: dualarm_piper
  initial_pos: [0.0, 0.3, 0.0]

instruction:
  template: pick_default
  template_mode: raw

task:
  params:
    mode: random_non_overlap
    min_separation: 0.03
    pose_range:
      x: [0.25, 0.55]
      y: [-0.35, 0.35]
      z: [0.0, 0.0]
      roll: [0.0, 0.0]
      pitch: [0.0, 0.0]
      yaw: [-3.141592653589793, 3.141592653589793]

asset_configs:
  pick:
    filter:
      super_category: fruits
    prim_name: pick_object

  distractors:
    anchor: pick
    match: [super_category]
    differ: [category]
    min_count: 1
    max_count: 3
    prim_name_prefix: distractor
